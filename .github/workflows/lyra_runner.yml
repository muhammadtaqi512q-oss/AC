name: LYRA AI Engine - Cached GitHub Server

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP: GitHub Actions Persistent Cache (Model dobara download nahi hoga)
      - name: Cache Hugging Face Model Files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: lyra-qwen-model-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch & Transformers
        run: |
          python -m pip install --upgrade pip
          pip install transformers torch

      - name: Execute Cached Model
        env:
          USER_PROMPT: ${{ github.event.issue.body }}
        run: |
          python -c "
          import os, json, torch
          from transformers import pipeline

          prompt = os.environ.get('USER_PROMPT', 'Hello')

          # Model cache se memory mein direct load hoga
          pipe = pipeline('text-generation', model='Qwen/Qwen2.5-0.5B-Instruct', torch_dtype=torch.float32)

          messages = [
              {'role': 'system', 'content': 'You are LYRA, an advanced AI model created by Muhammad Taqi. Answer accurately, smartly, and concisely.'},
              {'role': 'user', 'content': prompt}
          ]

          outputs = pipe(messages, max_new_tokens=256, do_sample=True, temperature=0.7)
          reply = outputs[0]['generated_text'][-1]['content']

          data = {'prompt': prompt, 'response': reply}

          with open('response.json', 'w') as f:
              json.dump(data, f)
          "

      - name: Deploy Response JSON
        run: |
          git config --global user.name "Muhammad Taqi (LYRA Engine)"
          git config --global user.email "taqi@lyra.ai"
          git add response.json
          git commit -m "LYRA: Updated response [Skip CI]" || exit 0
          git push

      - name: Auto Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
