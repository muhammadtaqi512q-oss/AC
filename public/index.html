<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyra — Created by Muhammad Taqi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background-color: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-indigo-400">Lyra AI</h1>
      <p class="text-xs text-gray-400">Created by <span class="text-gray-200 font-semibold">Muhammad Taqi</span></p>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <div class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
        Limit: <span id="limit-count" class="font-bold text-indigo-400">10/10</span> Left
      </div>
    </div>
  </header>

  <!-- Chat Output Area -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll max-w-4xl w-full mx-auto">
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
      <p class="text-indigo-400 font-bold mb-1">Lyra</p>
      <p class="text-gray-300">Hello! I am Lyra. My model is hosted via GitHub Pages and runs directly in your browser. How can I help you today?</p>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="bg-gray-900 border-t border-gray-800 p-4">
    <div class="max-w-4xl mx-auto flex gap-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type a message..." 
        class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-gray-100"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      />
      <button 
        onclick="sendMessage()" 
        id="send-btn"
        class="bg-indigo-600 hover:bg-indigo-500 font-semibold px-5 py-2 rounded-lg transition-colors"
      >
        Send
      </button>
    </div>
  </footer>

  <!-- WebLLM Engine -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // Configuration
    const DAILY_LIMIT = 10;
    const MODEL_NAME = "Llama-3.2-1B-Instruct-q4f16_1-MLC"; // Efficient in-browser model

    let engine = null;

    // Usage Tracking
    function getUsage() {
      const today = new Date().toDateString();
      const saved = JSON.parse(localStorage.getItem("lyra_usage") || "{}");
      if (saved.date !== today) {
        return { count: 0, date: today };
      }
      return saved;
    }

    function updateLimitUI() {
      const usage = getUsage();
      const remaining = Math.max(0, DAILY_LIMIT - usage.count);
      document.getElementById("limit-count").innerText = `${remaining}/${DAILY_LIMIT}`;
      return remaining;
    }

    function incrementUsage() {
      const usage = getUsage();
      usage.count += 1;
      localStorage.setItem("lyra_usage", JSON.stringify(usage));
      updateLimitUI();
    }

    // Initialize Engine
    async function initEngine() {
      try {
        engine = await webllm.CreateMLCEngine(MODEL_NAME, {
          initProgressCallback: (p) => {
            console.log("Loading Lyra:", p.text);
          }
        });
      } catch (err) {
        console.error("Failed to load engine:", err);
      }
    }

    window.sendMessage = async function() {
      const inputEl = document.getElementById("user-input");
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      const remaining = updateLimitUI();
      if (remaining <= 0) {
        alert("Aap ki aaj ki chat limit khatam ho chuki hai. Kal dobara try karein!");
        return;
      }

      // Add User Message
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `
        <div class="bg-indigo-950/40 border border-indigo-900/50 p-4 rounded-xl text-right">
          <p class="text-gray-400 font-bold mb-1">You</p>
          <p class="text-gray-200">${escapeHtml(prompt)}</p>
        </div>
      `;
      inputEl.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      // Check Engine
      if (!engine) {
        chatBox.innerHTML += `
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl" id="temp-loading">
            <p class="text-indigo-400 font-bold mb-1">Lyra</p>
            <p class="text-gray-400 italic">Initializing Lyra AI engine in browser...</p>
          </div>
        `;
        await initEngine();
        document.getElementById("temp-loading")?.remove();
      }

      // Generate AI Response
      incrementUsage();
      
      const responseDiv = document.createElement("div");
      responseDiv.className = "bg-gray-900 border border-gray-800 p-4 rounded-xl";
      responseDiv.innerHTML = `<p class="text-indigo-400 font-bold mb-1">Lyra</p><p class="text-gray-300" id="current-reply">...</p>`;
      chatBox.appendChild(responseDiv);

      try {
        const completion = await engine.chat.completions.create({
          messages: [{ role: "user", content: prompt }]
        });
        const reply = completion.choices[0].message.content;
        document.getElementById("current-reply").innerText = reply;
      } catch (e) {
        document.getElementById("current-reply").innerText = "Error generating response. Please check WebGPU support.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial UI Setup
    updateLimitUI();
  </script>
</body>
</html>
