<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA AI - Created by Muhammad Taqi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="glass-panel px-6 py-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-cyan-500/20">
                L
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-wide bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">LYRA</h1>
                <p class="text-xs text-slate-400">Created by <span class="text-cyan-400 font-semibold">Muhammad Taqi</span></p>
            </div>
        </div>
        <div class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            GitHub Cached Server (0 MB User Download)
        </div>
    </header>

    <!-- Chat Box Screen -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-scroll">
        <div class="flex items-start space-x-3 max-w-3xl">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center flex-shrink-0 border border-cyan-500/30">
                <i class="fa-solid fa-sparkles text-sm"></i>
            </div>
            <div class="glass-panel p-4 rounded-2xl rounded-tl-none border border-white/5 text-sm text-slate-200 shadow-md">
                Assalam-o-Alaikum! Main <b>LYRA</b> hoon. Model 100% GitHub ke cache server par stored hai, aap ke phone/PC par 0 MB load hai. Refresh karne par history remove ho jaye gi.
            </div>
        </div>
    </main>

    <!-- Input Bar -->
    <footer class="p-4 md:p-6 glass-panel border-t border-white/5">
        <div class="max-w-4xl mx-auto relative flex items-center">
            <textarea id="user-input" rows="1" placeholder="LYRA se kuch bhi poochein..." 
                class="w-full bg-slate-900/80 text-slate-100 rounded-2xl pl-4 pr-14 py-3 border border-white/10 focus:outline-none focus:border-cyan-500/50 resize-none text-sm transition-all"></textarea>
            <button id="send-btn" class="absolute right-2 p-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20 hover:opacity-90 active:scale-95 transition-all">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </footer>

    <script>
        const GITHUB_USERNAME = "muhammadtaqi512q-oss";
        const GITHUB_REPO = "AC";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start space-x-3 max-w-3xl ${isUser ? 'ml-auto flex-row-reverse space-x-reverse' : ''}`;

            const icon = isUser ? 'fa-user' : 'fa-sparkles';
            const iconBg = isUser ? 'bg-blue-600/20 text-blue-400 border-blue-500/30' : 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30';

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-lg ${iconBg} flex items-center justify-center flex-shrink-0 border">
                    <i class="fa-solid ${icon} text-sm"></i>
                </div>
                <div class="glass-panel p-4 rounded-2xl ${isUser ? 'rounded-tr-none bg-blue-600/10 border-blue-500/20' : 'rounded-tl-none'} border border-white/5 text-sm text-slate-200 shadow-md">
                    ${text}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function handleSend() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = '';
            appendMessage('user', prompt);

            const lyraMsgObj = appendMessage('lyra', '<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> GitHub cached runner query process kar raha hai...');
            const textElement = lyraMsgObj.querySelector('.glass-panel');

            try {
                // Public trigger without tokens
                await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: `Chat Request`,
                        body: prompt
                    })
                });

                // Poll response from GitHub server
                let attempts = 0;
                const checkResponse = setInterval(async () => {
                    attempts++;
                    try {
                        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/response.json?t=${Date.now()}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.prompt === prompt) {
                                textElement.innerText = data.response;
                                clearInterval(checkResponse);
                            }
                        }
                    } catch (e) {}

                    if (attempts > 30) {
                        textElement.innerText = "GitHub Action process complete. Page refresh karke check karein.";
                        clearInterval(checkResponse);
                    }
                }, 3000);

            } catch (err) {
                textElement.innerText = "Error connecting to GitHub runner.";
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
